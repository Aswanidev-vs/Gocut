name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Gocut

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            gcc-mingw-w64 \
            wine64

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./Gocut/frontend

      - name: Build Windows release binary
        run: wails build -platform windows/amd64 -clean

      - name: Locate release binary
        run: |
          FILE=$(find "$GITHUB_WORKSPACE/Gocut/build/bin" -maxdepth 1 -type f -name 'Gocut.exe' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Windows binary was not found in build/bin" >&2
            exit 1
          fi
          echo "RELEASE_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILE }}
          generate_release_notes: true
          draft: false
